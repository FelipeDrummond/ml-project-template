[project]
name = "ml-template"
version = "0.0.1"
description = "Template for PyTorch deep learning research projects (Mac dev → CUDA cloud)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Felipe Drummond", email = "felipe2002drummond@gmail.com" }]

dependencies = [
    "numpy>=1.26,<3",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "mlflow>=2.18,<3",
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "tqdm>=4.66",
    "accelerate>=1.0,<2",
]

# Torch is declared in extras so uv can route the wheel index per platform.
# - `cpu` extra: routes to the CPU index on Linux; macOS falls through to
#   default PyPI (MPS-capable wheel).
# - `cuda` extra: routes to the CUDA 12.1 index on Linux; macOS would also
#   fall through, but you should never select `cuda` on a Mac.
# `cpu` and `cuda` are mutually exclusive (see `[tool.uv].conflicts`).
[project.optional-dependencies]
cpu = [
    "torch==2.5.1",
    "torchvision==0.20.1",
]
cuda = [
    "torch==2.5.1",
    "torchvision==0.20.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[project.scripts]
ml-train = "ml_template.cli.train:main"
ml-eval = "ml_template.cli.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_template"]

# ----------------------------------------------------------------------------
# uv: torch wheel resolution.
#
# Local Mac (arm64): default PyPI wheels include MPS — `uv sync` is enough.
# Cloud Linux+CUDA: select the `cuda` extra; uv routes torch to the CUDA index.
#
# `cpu` and `cuda` extras conflict — only one can be active at a time.
# ----------------------------------------------------------------------------
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "outputs", "mlruns", "data"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PL",            # pylint
    "PT",            # pytest-style
    "NPY",           # numpy
]
ignore = [
    "PLR0913",  # too many arguments — common in ML configs
    "PLR2004",  # magic numbers — frequent and benign in research code
    "E501",     # line length is enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["I", "N", "PL", "B", "SIM", "RUF", "UP"]
"tests/**" = ["PLR2004", "S101", "NPY002"]
"src/**/__init__.py" = ["F401"]
# Seeding the legacy numpy global RNG is intentional — the helper exists
# precisely so old code paths using `np.random.*` are reproducible.
"src/ml_template/utils/seed.py" = ["NPY002"]

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# Pyright
# ----------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", "notebooks", "outputs", "mlruns", "data", ".venv"]
# Pragmatic: torch's `__all__` is incomplete (`torch.device`, `torch.equal`,
# `torch.cdist`, ... are flagged as private imports). Suppress that noise
# rather than littering the codebase with `# type: ignore`.
reportPrivateImportUsage = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
# Tighten a few checks that basic mode leaves loose.
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportImplicitOverride = false
reportInvalidTypeVarUse = "error"
reportSelfClsParameterName = "error"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires a CUDA GPU (skipped in CI)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

# ----------------------------------------------------------------------------
# Coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ml_template"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
