# Top-level Hydra config. Composes the default group selections below.
# Override anything from the CLI:
#   make train trainer=cloud model.hidden_dim=256 seed=7

# `_self_` placement matters. We put it BEFORE `experiment` so that an
# experiment override wins over the values declared directly in this file.
# Without this, `experiment=example` would silently fail to override the
# base mlflow.experiment_name etc.
defaults:
  - base_config
  - _self_
  - data: default
  - model: mlp
  - trainer: local
  - experiment: null

seed: 42

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: default
  run_name: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
