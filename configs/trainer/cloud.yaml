# Cloud GPU box. Explicit CUDA — fail loud if absent.
device: cuda
epochs: 50
lr: 1.0e-3
weight_decay: 1.0e-4
log_every_n_steps: 50
grad_clip_max_norm: 1.0
detect_anomaly: false
# bf16 autocast — assumes Ampere+ (3090, 4090, A100, H100). Switch to
# "fp16" if you ever rent V100 / T4 / 2080Ti.
precision: bf16
# torch.compile is CUDA-only. Leave null until you benchmark — first call
# is slow (compilation cost) and graph breaks can shadow real bugs.
# Set to "default" / "reduce-overhead" / "max-autotune" once you've
# verified the run is correct without it.
compile_mode: null
# LR schedule. Default for BC/IL/SL is linear-warmup + cosine decay.
# For RL (PPO, SAC), set this to null — those algorithms expect constant LR.
scheduler: linear_warmup_cosine
warmup_steps: null  # auto: min(0.1 * total_optim_steps, 1000)
min_lr_ratio: 0.1
grad_accum_steps: 1
# Checkpoint policy.
checkpoint_every_n_epochs: 1
keep_top_k_checkpoints: 3
resume_from: null
