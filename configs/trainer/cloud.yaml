# Cloud GPU box. Explicit CUDA — fail loud if absent.
device: cuda
epochs: 50
lr: 1.0e-3
weight_decay: 1.0e-4
log_every_n_steps: 50
# Perf knobs.
tf32: true
grad_clip_max_norm: 1.0
detect_anomaly: false
# bf16 autocast — assumes Ampere+ (3090, 4090, A100, H100). Switch to
# "fp16" if you ever rent V100 / T4 / 2080Ti.
precision: bf16
# Checkpoint policy.
checkpoint_every_n_epochs: 1
keep_top_k_checkpoints: 3
resume_from: null
