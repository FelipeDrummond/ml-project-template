# Local dev (MacBook M-series). MPS or CPU; small batches; few epochs.
device: auto
epochs: 2
lr: 1.0e-3
weight_decay: 0.0
log_every_n_steps: 5
# Perf knobs (mostly no-ops locally — TF32 only affects Ampere+ CUDA).
tf32: true
grad_clip_max_norm: 1.0
detect_anomaly: false
# No autocast locally — MPS doesn't autocast cleanly, CPU doesn't benefit.
precision: "no"
# Light checkpoint policy for local — short runs, keep 1.
checkpoint_every_n_epochs: 1
keep_top_k_checkpoints: 1
resume_from: null
