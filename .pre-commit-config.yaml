repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.391
    hooks:
      - id: pyright
        # Use the project venv so torch/hydra/etc. resolve.
        language: system
        entry: uv run pyright

  - repo: local
    hooks:
      - id: methods-doc-paths
        name: docs/methods.md references valid code paths
        entry: python scripts/check_docs_methods_paths.py
        language: system
        files: ^docs/methods\.md$
        pass_filenames: false
