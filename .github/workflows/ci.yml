name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies (CPU torch)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright

      - name: Tests
        run: uv run pytest -m "not gpu" --cov=src/ml_template --cov-report=term-missing

      - name: fast_dev_run end-to-end smoke
        # Exercises the full training path on CPU: model build, accelerator,
        # scheduler, grad-accum context, save→load round-trip. Catches the
        # "I changed the model and forgot the checkpoint format changed"
        # bug that unit tests miss.
        run: make dev-run
